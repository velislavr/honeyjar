# Build the app images once here so 1 GB VMs only pull them (building Next.js on the VM runs out of memory).
name: images

on:
  push:
    branches: [master]
    paths: [core/**, dashboard/**, sensor/http-honeypot/**, sensor/cowrie/**, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: honeyjar-core, context: core }
          - { name: honeyjar-dashboard, context: dashboard }
          - { name: honeyjar-http, context: sensor/http-honeypot }
          - { name: honeyjar-cowrie, context: sensor/cowrie }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # amd64 for Azure B1s / B2ats v2, arm64 for B2pts v2 and Oracle Ampere
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
