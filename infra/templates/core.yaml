#cloud-config
# Honeyjar CORE: Ubuntu 24.04 on Azure (Standard_B2ats_v2, 1 GB) or any bigger VM.
# Rendered by infra/render.py - paste the rendered file (infra/out/core-user-data.yaml) as the VM's
# "Custom data". Contains secrets: never commit the rendered output.
package_update: true
packages: [docker.io, docker-compose-v2, wireguard, git]

users:
  - default
  - name: ops
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys: ["${ssh_key}"]

# The stack idles around 350 MB; swap absorbs feed refreshes and image pulls on a 1 GB VM.
swap:
  filename: /swapfile
  size: 2147483648

write_files:
  - path: /etc/ssh/sshd_config.d/10-honeyjar.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
  - path: /etc/wireguard/wg0.conf
    permissions: "0600"
    content: |
${wg_conf}
  - path: /etc/honeyjar/core.env
    permissions: "0600"
    content: |
${core_env}
  # Docker must start after the tunnel exists: the API binds to the WireGuard address.
  - path: /etc/systemd/system/docker.service.d/10-after-wireguard.conf
    content: |
      [Unit]
      Wants=wg-quick@wg0.service
      After=wg-quick@wg0.service
  - path: /etc/systemd/system/honeyjar-core-firewall.service
    content: |
      [Unit]
      Description=Honeyjar: restrict sensors to the ingest API
      After=docker.service
      Requires=docker.service
      [Service]
      Type=oneshot
      ExecStart=/opt/honeyjar/core/firewall.sh
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target

runcmd:
  # Inbound filtering is the cloud firewall's job (Azure NSG: 80, 443, udp/51820, SSH from your IP).
  - systemctl restart ssh
  - systemctl enable --now wg-quick@wg0
  - git clone ${repo_url} /opt/honeyjar
  - cp /etc/honeyjar/core.env /opt/honeyjar/core/.env
  - chmod +x /opt/honeyjar/core/firewall.sh /opt/honeyjar/sensor/firewall.sh
  - systemctl daemon-reload
  - systemctl enable --now docker honeyjar-core-firewall
  # Pull the CI-built images; fall back to building on the VM if they aren't published (needs >2 GB RAM).
  - cd /opt/honeyjar/core && (docker compose --profile prod pull || docker compose --profile prod build)
  - cd /opt/honeyjar/core && docker compose --profile prod up -d
  - echo "Honeyjar core. Logs - cd /opt/honeyjar/core && docker compose logs -f" > /etc/motd
